backend:
  name: github
  repo: Ruyue-Kinsenka/Ruyue-Kinsenka.github.io
  branch: main
  # GitHub Pages 环境下，线上 CMS 登录通常需要外部 OAuth 提供者
  # 例如 decap-oauth-provider，配置后取消下方注释
  # base_url: https://your-oauth-provider.example.com
  # auth_endpoint: auth

publish_mode: editorial_workflow
site_url: https://ruyue-kinsenka.github.io
logo_url: /images/admin-logo.svg
locale: zh_Hans

media_folder: public/uploads
public_folder: /uploads

local_backend: true

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "posts/{{slug}}"
    sortable_fields:
      - publishedAt
      - title
    fields:
      - { label: 标题, name: title, widget: string }
      - {
          label: 摘要,
          name: description,
          widget: text,
          hint: "建议 60-120 字，用于卡片与 SEO",
        }
      - { label: 发布时间, name: publishedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: 更新日期, name: updatedAt, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - { label: 分类, name: category, widget: string }
      - { label: 标签, name: tags, widget: list, allow_add: true, summary: "{{fields.tag}}", field: { label: 标签, name: tag, widget: string } }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 封面图, name: cover, widget: image, required: false }
      - { label: 封面替代文本, name: coverAlt, widget: string, required: false }
      - { label: 正文, name: body, widget: markdown }
